<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Masuk — Admin HIMATIKA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3A5F'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' text-anchor='middle' fill='%23F4C542'%3E%CE%A3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
<div id="app"><main class="screen"><div class="login-card">
<span class="logo-mark" aria-hidden="true">Σ</span>
<h1>Admin HIMATIKA ITERA</h1>
<p class="muted">Masuk dengan email dan kata sandi akun pengelola Anda. Lupa kata sandi? Hubungi Super Admin.</p>
<div id="login-msg" class="alert" role="alert" hidden></div>
<form id="login-form" class="form-grid form-grid--single" autocomplete="on" novalidate>
<div class="field"><label class="field__label" for="email">Email</label>
<input id="email" name="email" class="input" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="120" required></div>
<div class="field"><label class="field__label" for="password">Kata sandi</label>
<div class="imgfield__row"><input id="password" name="password" class="input" type="password" autocomplete="current-password" maxlength="128" required>
<button id="toggle-pw" class="btn btn--ghost btn--sm" type="button" aria-pressed="false">Tampilkan</button></div></div>
<button id="login-btn" class="btn btn--primary" type="submit" disabled>Masuk</button>
</form>
<p class="muted small"><a href="../index.html">← Kembali ke website</a></p>
</div></main></div>
<script type="module" src="../assets/js/admin/page-login.js"></script>
</body>
</html>

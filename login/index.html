<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Anggota · Himatika ITERA</title>
<meta name="description" content="Login eksklusif anggota aktif Himatika ITERA.">
<meta name="theme-color" content="#facc15">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tailwind.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-stone-50 text-neutral-900 antialiased dark:bg-neutral-950 dark:text-neutral-100" data-root="../" data-page="login">
<div id="app-header"></div>
<main id="main" class="mx-auto max-w-6xl px-4 py-10">

<div class="mx-auto max-w-md">
  <div class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm dark:border-neutral-800 dark:bg-neutral-900 p-8">
    <div class="grid h-14 w-14 place-items-center rounded-2xl bg-brand-400 text-3xl font-extrabold text-neutral-900 shadow">∑</div>
    <h1 class="mt-5 text-2xl font-extrabold">Login Anggota</h1>
    <p class="mt-1 text-sm text-neutral-600 dark:text-neutral-400">Khusus anggota aktif Himatika ITERA.</p>
    <form id="login-form" class="mt-6 space-y-4">
      <div><label class="mb-1 block text-sm font-semibold" for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" class="w-full rounded-xl border border-neutral-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-300 dark:border-neutral-700 dark:bg-neutral-950"></div>
      <div><label class="mb-1 block text-sm font-semibold" for="password">Kata sandi</label><input id="password" name="password" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-neutral-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-300 dark:border-neutral-700 dark:bg-neutral-950"></div>
      <p id="login-error" class="min-h-[1.25rem] text-sm font-medium text-red-600" role="alert"></p>
      <button type="submit" class="w-full rounded-xl bg-brand-400 px-5 py-2.5 text-sm font-bold text-neutral-900 shadow hover:bg-brand-300 disabled:opacity-60">Masuk</button>
    </form>
  </div>
</div>

</main>
<div id="app-footer"></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/pages.js"></script>
</body>
</html>
